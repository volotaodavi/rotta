name: Maior versionCode na Google Play
description: >
  Pergunta à Play Console qual o maior versionCode que ela já conhece
  para este pacote. SOMENTE LEITURA — abre o rascunho obrigatório da API,
  lê e descarta sem nunca chamar `commit`.

# Existe como action composta, e não copiada em cada workflow, porque a
# mesma consulta é usada em três lugares (calcular o próximo número na
# build, conferir o pacote antes de enviar, e o diagnóstico avulso) e
# porque a assinatura do JWT é a parte mais fácil de copiar errado.
#
# Consulta BUNDLES e TRACKS, não só tracks. Essa distinção é o motivo
# desta action existir: a Play Console recusa qualquer código menor ou
# igual a um já ENVIADO, mesmo que esse envio nunca tenha entrado numa
# faixa nem sido publicado, e mesmo que a versão tenha sido excluída
# depois. Olhar só as faixas devolve um número menor que o real e leva
# exatamente ao erro genérico ("não permite que os usuários existentes
# atualizem...") que custou três builds chutadas em 16/09/2026.
#
# O JWT é assinado com o `openssl` do runner, não com a biblioteca
# `cryptography` do Python — ela não vem instalada no ubuntu-latest, o
# openssl vem.

inputs:
  service_account_json:
    description: "Conteúdo do secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
    required: true
  pacote:
    description: "applicationId do app na Play Console"
    required: false
    default: br.com.rottabr

outputs:
  maior:
    description: "Maior versionCode conhecido pela Play, ou vazio se a consulta falhou"
    value: ${{ steps.consulta.outputs.maior }}
  ok:
    description: "'true' quando a consulta funcionou; 'false' quando quem chama precisa se virar sem ela"
    value: ${{ steps.consulta.outputs.ok }}

runs:
  using: composite
  steps:
    - id: consulta
      shell: bash
      env:
        KEY_JSON: ${{ inputs.service_account_json }}
        PACOTE: ${{ inputs.pacote }}
      run: |
        set -uo pipefail

        # Qualquer falha aqui devolve ok=false em vez de quebrar o
        # workflow: quem chama decide se isso é fatal (envio) ou se dá
        # para seguir com um plano B (build).
        desistir() {
          echo "::warning::Não consegui consultar a Play Console: $1"
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "maior=" >> "$GITHUB_OUTPUT"
          exit 0
        }

        [ -n "${KEY_JSON:-}" ] || desistir "secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON ausente"

        printf '%s' "$KEY_JSON" > /tmp/sa.json
        python3 -c "import json;print(json.load(open('/tmp/sa.json'))['private_key'])" > /tmp/sa.pem \
          || desistir "chave de conta de serviço ilegível"
        EMAIL=$(python3 -c "import json;print(json.load(open('/tmp/sa.json'))['client_email'])")

        b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
        AGORA=$(date +%s)
        CABECALHO=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
        CORPO=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' \
          "$EMAIL" "$AGORA" "$((AGORA + 3600))" | b64url)
        ASSINATURA=$(printf '%s.%s' "$CABECALHO" "$CORPO" | openssl dgst -sha256 -sign /tmp/sa.pem | b64url)

        TOKEN=$(curl -sS -X POST https://oauth2.googleapis.com/token \
          -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
          --data-urlencode "assertion=$CABECALHO.$CORPO.$ASSINATURA" \
          | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
        [ -n "$TOKEN" ] || desistir "falha ao autenticar (conta de serviço $EMAIL)"

        BASE="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACOTE"
        EDIT=$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Length: 0" "$BASE/edits" \
          | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
        [ -n "$EDIT" ] || desistir "não consegui abrir o rascunho de leitura"

        curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/edits/$EDIT/bundles" > /tmp/bundles.json
        curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/edits/$EDIT/tracks" > /tmp/tracks.json
        # Descarta o rascunho — a prova de que nada foi alterado.
        curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" "$BASE/edits/$EDIT" >/dev/null || true

        MAIOR=$(python3 - <<'PY'
        import json

        codigos = []

        try:
            for b in json.load(open("/tmp/bundles.json")).get("bundles", []):
                codigos.append(int(b["versionCode"]))
        except Exception:
            pass

        try:
            for t in json.load(open("/tmp/tracks.json")).get("tracks", []):
                for r in t.get("releases", []):
                    codigos += [int(v) for v in (r.get("versionCodes") or [])]
        except Exception:
            pass

        print(max(codigos) if codigos else -1)
        PY
        )

        [ "$MAIOR" != "-1" ] || desistir "a resposta não trouxe nenhum versionCode"

        echo "Maior versionCode já conhecido pela Play Console: $MAIOR"
        echo "maior=$MAIOR" >> "$GITHUB_OUTPUT"
        echo "ok=true" >> "$GITHUB_OUTPUT"
