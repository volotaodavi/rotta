name: Keep API Warm

# Mitigação de latência de login (Dossiê 12 §7.4 — "login demorando
# muito", reportado pelo usuário em produção): o Render free tier
# suspende `apps/api` após ~15min sem tráfego, e o primeiro request
# depois disso paga o "cold start" — 30 a 90+ segundos, confirmado por
# observação direta neste mesmo Render (múltiplas requisições em
# sequência, a primeira levando 35s+ e as seguintes < 1s). Isso é
# ortogonal a qualquer otimização de código no `AuthService`: mesmo o
# login mais rápido do mundo ainda esperaria o container acordar.
#
# Ferramenta gratuita (sem custo, sem cadastro novo, já que o repo já
# vive no GitHub): um cron do GitHub Actions batendo no endpoint de
# liveness a cada poucos minutos, mantendo o processo quente na maior
# parte do tempo. Isso NÃO é um substituto de um plano pago do Render
# (que elimina a suspensão por completo) — é só uma forma honesta e
# gratuita de reduzir a chance de cold start, sem forçar 100% de
# uptime (ver nota sobre limite de horas grátis abaixo).
on:
  schedule:
    # A cada 5 minutos (pedido do usuário 05/09/2026: apertar o
    # intervalo sem estourar o limite gratuito do Render) — é o menor
    # intervalo que o `schedule` do GitHub Actions suporta de forma
    # confiável, dando mais margem contra o atraso de agendamento que
    # já causava falha mesmo com o cron de 10 em 10 (o cron não é
    # garantido no minuto exato; um atraso ocasional bastava pra
    # estourar a janela de 15min de suspensão do Render).
    #
    # NÃO apertar mais que isso: as 750h grátis/mês do Render (Dossiê
    # 12 §7.4) já são quase todas consumidas por UM serviço ficando
    # acordado o mês inteiro (~720-744h num mês de 30-31 dias) — isso
    # DELIBERADAMENTE ainda deixa `apps/api` dormir em janelas
    # realmente ociosas (de madrugada, por exemplo), em vez de forçá-la
    # 100% acordada. Forçar 100% arriscaria estourar as 750h (as 750h
    # são compartilhadas entre TODOS os serviços gratuitos da mesma
    # conta Render) e suspender a conta inteira até o mês seguinte —
    # um problema muito pior que uma soneca ocasional de 30-90s.
    # Durante uso real da plataforma, este ping nem chega a importar:
    # o próprio tráfego de usuários já mantém a API acordada sozinha.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping /v1/health
    runs-on: ubuntu-latest
    steps:
      - name: Ping API liveness endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" \
            "${API_HEALTH_URL}"
        env:
          API_HEALTH_URL: "https://rotta-vt7i.onrender.com/v1/health"
