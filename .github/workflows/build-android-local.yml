name: Build Android (EAS local, sem custo)

# Alternativa gratuita ao EAS Build em nuvem — pedido do usuário
# 11/09/2026 ("tem outro local para gerar isso não? De forma
# gratuita", depois "algo que seja à altura").
#
# Contexto real: a conta gratuita do EAS Build tem uma cota mensal de
# builds Android na nuvem (confirmado ao vivo neste projeto: "This
# account has used its Android builds from the Free plan this month,
# which will reset in ... on Thu Oct 01 2026"). Essa cota é
# especificamente da FILA de build da própria Expo — não existe cota
# nenhuma para `eas build --local`, porque nesse modo o binário é
# compilado na própria máquina que roda o comando (aqui, um runner do
# GitHub Actions), não na infraestrutura da Expo. A Expo só é usada
# pra autenticar e baixar as credenciais de assinatura (keystore) já
# configuradas na conta — isso nunca consumiu cota de build, hoje ou
# em qualquer plano.
#
# Runners do GitHub Actions são gratuitos (2000 min/mês no plano Free
# de conta pessoal, e o dobro em contas de organização) — então isso
# não é um contorno frágil, é o jeito oficial e documentado da própria
# Expo de gerar build sem depender da fila/cota da nuvem deles:
# https://docs.expo.dev/build-reference/local-builds/
#
# Único pré-requisito que não dá pra automatizar por aqui: o segredo
# `EXPO_TOKEN` (Settings → Secrets and variables → Actions, neste
# repositório) precisa existir, com um Access Token gerado em
# https://expo.dev/accounts/[conta]/settings/access-tokens — é uma
# credencial de conta, só o dono consegue gerar.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil do eas.json a buildar"
        type: choice
        required: true
        default: preview
        options:
          - development
          - preview
          - production

concurrency:
  group: build-android-local-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build local (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Sem isso, o GITHUB_TOKEN automático só tem permissão de LEITURA
    # (padrão da conta) — o passo de Release no final falharia com 403
    # "Resource not accessible by integration" (confirmado ao vivo no
    # workflow irmão publish-build-release.yml).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # AGP 8.6 (fixado pelo @react-native/gradle-plugin desta versão
      # do RN) exige JDK 17 — o mesmo runtime que o próprio Android
      # Studio usa hoje.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Instala só o que o app realmente declara em app.config.ts
      # (expo-build-properties): compileSdk/targetSdk 36, build-tools
      # 36.0.0. `android-actions/setup-android` já cuida de aceitar as
      # licenças do SDK sozinho.
      #
      # `packages: platform-tools` (achado 15/09/2026, builds #13/#14
      # falhando em ~30s, sempre no mesmo ponto): o padrão da própria
      # action é `packages: 'tools platform-tools'` — "tools" é o pacote
      # LEGADO do SDK Tools, removido do repositório oficial da Google
      # (`sdkmanager tools` responde "Warning: Failed to find package
      # 'tools'", exit code 1, e a action trata isso como falha fatal).
      # Nunca precisamos dele — o passo seguinte já instala
      # `cmdline-tools`/`platforms`/`build-tools` explicitamente, do
      # jeito que builds Android modernos (Gradle/AGP) sempre fizeram.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Instalar plataforma/build-tools do Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - run: pnpm install --frozen-lockfile

      # `@rotta/validators` é o único pacote do monorepo cujo `main`
      # aponta pra um `dist/` compilado (`tsc`) em vez de apontar
      # direto pro `.ts` fonte (todos os outros — `@rotta/ui`,
      # `@rotta/theme`, `@rotta/api-client` etc. — o Metro resolve
      # sem build nenhum, via Babel). Buildar esse pacote AQUI, no
      # checkout deste job, não resolve nada: o passo "Build local via
      # EAS CLI" abaixo (`eas build --local`) copia o projeto pra um
      # diretório isolado próprio (`/tmp/.../eas-build-local-nodejs/...`)
      # e reinstala as dependências do zero lá dentro — como `dist/` é
      # ignorado pelo git (.gitignore), esse build daqui nunca
      # atravessa pra cópia isolada. O build de verdade que resolve
      # isso é o script `eas-build-post-install` em
      # `apps/mobile/package.json` — é um hook oficial da EAS,
      # documentado em https://docs.expo.dev/build-reference/npm-hooks/,
      # que a própria EAS roda DENTRO do diretório isolado, logo depois
      # do install dela e antes do bundle (fase `EAGER_BUNDLE`).

      # `development`/`preview` usam `distribution: internal` (eas.json)
      # — a EAS gera `.apk` por padrão nesse caso. `production` não
      # define `distribution`, então cai no padrão da EAS pra builds de
      # loja: App Bundle (`.aab`), o formato que a Google Play exige.
      - name: Definir extensão do artefato
        id: artifact
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            echo "ext=aab" >> "$GITHUB_OUTPUT"
          else
            echo "ext=apk" >> "$GITHUB_OUTPUT"
          fi

      # `versionCode` do Android — perguntado à Play Console, nunca
      # digitado à mão.
      #
      # Corrigido em 17/09/2026 ("Pq 37? Se vc ficou em 2.000.000.000?").
      # A primeira automação usava `2000000000 + github.run_number`, e o
      # `run_number` conta TODA execução deste workflow — inclusive as
      # que falharam e as que nunca viraram publicação. Com o contador
      # em 36, a próxima build sairia 2.000.000.037: um salto de 37 sobre
      # o que está publicado, quando o pedido era "de 1 em 1".
      #
      # Agora o número vem da fonte que decide de verdade: o maior
      # versionCode que a Play Console já conhece, mais 1. É o menor
      # valor que ela aceita, então nenhum número é queimado à toa.
      - name: Consultar o maior versionCode já na Play Console
        id: play
        uses: ./.github/actions/play-maior-versioncode
        with:
          service_account_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Calcular o versionCode do Android
        id: versioncode
        env:
          MAIOR_NA_PLAY: ${{ steps.play.outputs.maior }}
          CONSULTA_OK: ${{ steps.play.outputs.ok }}
        run: |
          set -euo pipefail

          # Plano B de quando a consulta falha (API fora do ar, secret
          # ausente). `2000000000 + run_number` é grosseiro, mas tem a
          # única propriedade inegociável: nunca cai e nunca fica abaixo
          # do que já foi publicado — a Play Console recusa qualquer
          # código menor ou igual a um já enviado, e isso vale mesmo para
          # versão excluída depois.
          PISO=2000000000

          if [ "$CONSULTA_OK" = "true" ]; then
            CODIGO=$((MAIOR_NA_PLAY + 1))
            echo "Maior na Play: $MAIOR_NA_PLAY -> esta build: $CODIGO (+1)"
          else
            CODIGO=$((PISO + ${{ github.run_number }}))
            echo "::warning::Sem resposta da Play Console — usando o plano B, $CODIGO."
          fi

          # Cinto de segurança contra o modo de falha mais caro: se a
          # consulta um dia devolver um número velho, um versionCode
          # abaixo do piso seria recusado no envio depois de 40 minutos
          # de build gastos.
          if [ "$CODIGO" -le "$PISO" ]; then
            CODIGO=$((PISO + ${{ github.run_number }}))
            echo "::warning::Número consultado não passou do piso publicado — usando $CODIGO."
          fi

          echo "valor=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "versionCode desta build: $CODIGO"

      - name: Build local via EAS CLI (não consome cota da nuvem)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_VERSION_CODE: ${{ steps.versioncode.outputs.valor }}
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --local \
            --non-interactive \
            --output "${{ github.workspace }}/rotta-${{ inputs.profile }}.${{ steps.artifact.outputs.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rotta-android-${{ inputs.profile }}-${{ github.run_number }}
          path: rotta-${{ inputs.profile }}.${{ steps.artifact.outputs.ext }}
          retention-days: 90

      # Pedido do usuário 11/09/2026 ("falta só o apk e o app") — o
      # artefato do Actions sozinho não serve como link público
      # permanente pro `/baixar-app` (expira, exige login no GitHub
      # pra baixar). Uma GitHub Release, por outro lado, é pública (o
      # repositório já é público, confirmado) e o link
      # `.../releases/download/<tag>/<arquivo>` não expira. Usa o
      # `GITHUB_TOKEN` automático do próprio Actions (permissão
      # padrão de escrita em Releases), não precisa de segredo extra.
      - name: Publicar como GitHub Release (link público permanente)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ inputs.profile }}-run${{ github.run_number }}
          name: "Rotta Android (${{ inputs.profile }}) — build #${{ github.run_number }}"
          files: rotta-${{ inputs.profile }}.${{ steps.artifact.outputs.ext }}
          make_latest: ${{ inputs.profile == 'preview' }}
