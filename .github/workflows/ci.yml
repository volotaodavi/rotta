name: CI

# Pipeline de Integracao Continua — Dossie 23, Secao 14.
#
# Roda em todo Pull Request e em push para a branch padrao (Dossie 23,
# Secao 11.1 — trunk-based). Cada etapa usa o Turborepo para executar
# apenas contra os apps/packages efetivamente afetados pelo diff,
# aproveitando o cache remoto quando configurado (TURBO_TOKEN/TURBO_TEAM
# como secrets do repositorio) — Dossie 23, Secao 14.2.
#
# BUG REAL #1 (auditoria minuciosa, 04/09/2026): os triggers abaixo
# apontavam pra `main`, mas este repositorio NUNCA teve uma branch
# `main` — a branch padrao real e `claude/rotta-platform-design-gr0xzq`
# (`git remote show origin` -> `HEAD branch:`). Resultado: nenhum
# destes triggers disparava NUNCA — confirmado via GitHub Actions API
# (`list_workflow_runs` devolvia `total_count: 0` pra este workflow, em
# qualquer branch). Toda a suite abaixo nunca rodou de verdade neste
# repositorio ate esta correcao.
#
# BUG REAL #2, encontrado ao ligar o CI pela primeira vez: os jobs
# usavam `pnpm turbo run <task> --filter="...[HEAD^1]"` pra rodar só
# contra o que mudou. Duas falhas do MESMO mecanismo, ambas
# confirmadas ao vivo nas duas primeiras execucoes reais deste
# workflow: (a) um push cujo diff nao toca nenhum input rastreado pelo
# Turborepo (ex.: só este arquivo de workflow) faz o filtro selecionar
# ZERO pacotes — job "passa" sem checar literalmente nada; (b) mesmo
# quando o filtro seleciona pacotes de verdade, o alcance parcial
# escondeu por completo o BUG REAL #3 abaixo (só apareceu quando um
# commit de formatacao tocou apps/api pela primeira vez). Sem cache
# remoto configurado (TURBO_TOKEN/TURBO_TEAM) e sem cache de `.turbo`
# entre runs, rodar tudo sem filtro nao é mais lento na prática (o
# proprio cache de conteudo do Turborepo já evita trabalho redundante
# dentro do mesmo run) — e é a unica forma de garantir que o CI está
# de fato checando o repositorio inteiro a cada vez.
#
# BUG REAL #3: nem o job de lint/typecheck nem o de build geravam o
# Prisma Client antes de rodar — só o job de teste fazia isso, e só
# por causa dos testes E2E. Sem `prisma generate`, `@prisma/client`
# não tem os tipos reais dos models, e todo acesso a `this.prisma.X`
# vira `any`/erro de tipo — isso sozinho gerou 6271 erros de lint
# (regras type-aware: `@typescript-eslint/no-unsafe-return`,
# `require-await`) e 1141 erros de `tsc`/build em cima de código que
# na verdade está correto (confirmado: clonando o repo do zero,
# gerando o Prisma Client e rodando via Turborepo, tudo passa limpo).
on:
  pull_request:
    branches: [claude/rotta-platform-design-gr0xzq]
  push:
    branches: [claude/rotta-platform-design-gr0xzq]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    # BUG REAL #4, encontrado na 3ª execução real do CI: `turbo.json`
    # declara `"typecheck": { "dependsOn": ["^build", "build"] }` — ou
    # seja, tipar @rotta/admin/@rotta/web exige primeiro um `next build`
    # de verdade (não só checar tipos), e esse build EXECUTA o código
    # que valida `NEXT_PUBLIC_API_URL` (Zod) durante a geração estática
    # das páginas. Sem essa env aqui, `@rotta/admin#build` falhava com
    # `ZodError: NEXT_PUBLIC_API_URL Required` — mesma env que o job
    # "Lighthouse" já define lá embaixo, só que só pra apps/web.
    env:
      NEXT_PUBLIC_API_URL: "https://rotta-vt7i.onrender.com/v1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # BUG REAL #3 (ver nota no topo do arquivo) — sem isso, todo
      # `this.prisma.X` em apps/api vira `any`/erro de tipo, e o lint
      # type-aware (@typescript-eslint/no-unsafe-return, require-await)
      # dispara em cascata sobre código correto. Não precisa de banco de
      # dados de verdade — só lê prisma/schema.prisma.
      - name: Gerar Prisma Client (@rotta/api)
        run: pnpm --filter=@rotta/api prisma:generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Type check
        run: pnpm turbo run typecheck

      - name: Format check
        run: pnpm format:check

  test:
    name: Testes unitários e de integração
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        # postgis/postgis em vez de postgres puro — mesma decisão de
        # docker-compose.yml (Rotta Geo Platform depende da extensão
        # `postgis`, ausente na imagem `postgres:16-alpine`).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rotta
          POSTGRES_PASSWORD: rotta_ci_only
          POSTGRES_DB: rotta_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rotta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://rotta:rotta_ci_only@localhost:5432/rotta_ci?schema=public"
      # Sem pooler neste ambiente — sempre igual a DATABASE_URL (Dossie 31).
      DIRECT_URL: "postgresql://rotta:rotta_ci_only@localhost:5432/rotta_ci?schema=public"
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Mesmo motivo do job "Lint & Type Check" (ver nota no topo do
      # arquivo, BUG REAL #3) — sem isso, os testes unitários de
      # apps/api também rodariam sobre tipos quebrados.
      - name: Gerar Prisma Client (@rotta/api)
        run: pnpm --filter=@rotta/api prisma:generate

      - name: Test
        run: pnpm turbo run test

      # Testes E2E do @rotta/api (test/*.e2e-spec.ts) rodam à parte do
      # "Test" acima: só eles sobem o Nest completo contra um Postgres
      # de verdade, migrado e com o catálogo de planos semeado — a
      # única forma de pegar em CI um bug como "cadastro de Empresa
      # falha porque o plano STARTER nunca foi inserido" (encontrado em
      # produção, não em CI, exatamente porque esta etapa nunca existiu
      # até agora).
      - name: Preparar banco de testes E2E (@rotta/api)
        env:
          DATABASE_URL: "postgresql://rotta:rotta_ci_only@localhost:5432/rotta_ci?schema=public"
          # Sem pooler neste ambiente — sempre igual a DATABASE_URL (Dossie 31).
          DIRECT_URL: "postgresql://rotta:rotta_ci_only@localhost:5432/rotta_ci?schema=public"
        # `prisma:generate` já rodou acima (Prisma Client não muda com
        # DATABASE_URL) — aqui só migra e semeia o banco de teste.
        run: |
          pnpm --filter=@rotta/api prisma:migrate:deploy
          pnpm --filter=@rotta/api prisma:seed

      - name: Testes E2E (@rotta/api)
        env:
          TEST_DATABASE_URL: "postgresql://rotta:rotta_ci_only@localhost:5432/rotta_ci?schema=public"
          TEST_REDIS_URL: "redis://localhost:6379"
        run: pnpm --filter=@rotta/api test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Mesmo motivo do job "Lint & Type Check" (ver BUG REAL #4 lá) —
    # `@rotta/admin`/`@rotta/web` fazem um `next build` de verdade
    # aqui também.
    env:
      NEXT_PUBLIC_API_URL: "https://rotta-vt7i.onrender.com/v1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Mesmo motivo do job "Lint & Type Check" (ver nota no topo do
      # arquivo, BUG REAL #3).
      - name: Gerar Prisma Client (@rotta/api)
        run: pnpm --filter=@rotta/api prisma:generate

      - name: Build
        run: pnpm turbo run build

  dependency-audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Bloqueia o merge em caso de vulnerabilidade critica sem patch
      # (Dossie 12, Secao 19.5).
      - name: Audit
        run: pnpm audit --audit-level=critical
        continue-on-error: false

  lighthouse:
    name: Lighthouse (apps/web)
    runs-on: ubuntu-latest
    needs: build
    # Dossie 34 (Prompt 24) — mede Performance/Acessibilidade/Boas
    # praticas/SEO das paginas publicas a cada push. Limiares em modo
    # "warn" (nao bloqueia merge) ate uma primeira execucao real
    # produzir uma baseline confiavel — ver `apps/web/lighthouserc.js`.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build apps/web
        env:
          NEXT_PUBLIC_API_URL: "https://rotta-vt7i.onrender.com/v1"
        run: pnpm turbo run build --filter=@rotta/web

      - name: Lighthouse CI
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "https://rotta-vt7i.onrender.com/v1"
        run: pnpm exec lhci autorun --config=./lighthouserc.js
        continue-on-error: true
