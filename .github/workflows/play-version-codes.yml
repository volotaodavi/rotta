name: Consultar versionCodes na Google Play

# Diagnóstico SOMENTE LEITURA: mostra qual número a Play Console já
# conhece e qual seria o próximo envio válido.
#
# Criado em 16/09/2026, quando a Play recusou o envio com "não permite
# que os usuários existentes atualizem para os novos pacotes" — erro
# genérico que significa "já existe aí um versionCode maior ou igual ao
# que você mandou". Sem ver o Console, a alternativa era chutar um número
# cada vez maior até passar; este workflow pergunta direto à API.
#
# Em 17/09/2026 a consulta virou a action composta
# `.github/actions/play-maior-versioncode` — a mesma que a build usa para
# calcular o próximo número e que o envio usa para conferir o pacote.
# Com uma implementação só, não existe a chance de um dos três lugares
# olhar uma fonte diferente e dar uma resposta diferente.
on:
  workflow_dispatch:

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - id: play
        uses: ./.github/actions/play-maior-versioncode
        with:
          service_account_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Resumo
        env:
          MAIOR: ${{ steps.play.outputs.maior }}
          CONSULTA_OK: ${{ steps.play.outputs.ok }}
        run: |
          set -euo pipefail

          if [ "$CONSULTA_OK" != "true" ]; then
            echo "::error::A consulta não funcionou — veja o aviso do passo anterior."
            exit 1
          fi

          echo "MAIOR VERSIONCODE EM USO: $MAIOR"
          echo "USAR NO PROXIMO ENVIO:    $((MAIOR + 1))"
