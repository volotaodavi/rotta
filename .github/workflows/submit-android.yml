name: Enviar build Android pra Google Play

# Pedido do usuário 11/09/2026 ("cadê o da Play Store?") — o build
# `production` (.aab) corrigido (EXPO_PUBLIC_WEB_URL) ainda não tinha
# sido reenviado ao Play Console, só o .apk de sideload. `eas submit`
# não usa a fila/cota de build da EAS (é só upload pro Play Console),
# então não é afetado pelo mesmo bloqueio do plano Free.
#
# Recebe a URL pública do .aab (a GitHub Release que
# build-android-local.yml já publica sozinho) e envia direto, sem
# precisar baixar/reenviar nada manualmente.
on:
  workflow_dispatch:
    inputs:
      aab_url:
        description: "URL pública do .aab (asset da GitHub Release do build production)"
        type: string
        required: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # `eas.json` (submit.production) NAO tem mais `serviceAccountKeyPath`
      # (removido de proposito, 11/09/2026, pra testar se a conta ja tem
      # uma Google Service Account Key guardada nos servidores da EAS de
      # um envio anterior). Se o secret existir, escreve o arquivo local
      # e ele tem prioridade; se nao existir, deixa o eas-cli tentar usar
      # a credencial remota (ou avisar que precisa de uma).
      - name: Escrever a chave de conta de serviço do Google Play (se houver secret)
        working-directory: apps/mobile
        env:
          KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY_JSON" ]; then
            echo "Secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON nao configurado — eas submit vai tentar usar credencial ja guardada na conta EAS, se existir."
          else
            printf '%s' "$KEY_JSON" > google-play-service-account.json
            echo "Chave escrita a partir do secret."
          fi

      - name: Enviar pro Play Console (track interno, mesmo do eas.json)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest submit \
            --platform android \
            --profile production \
            --url "${{ inputs.aab_url }}" \
            --non-interactive
