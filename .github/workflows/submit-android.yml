name: Enviar build Android pra Google Play

# Envia um `.aab` já publicado como GitHub Release direto pra Play
# Console, sem baixar/reenviar arquivo na mão. `eas submit` não usa a
# fila/cota de build da EAS (é só upload), então não é afetado pelo
# bloqueio do plano Free.
#
# NÃO dispara sozinho: só `workflow_dispatch`. Com o app em análise na
# Play Console (16/09/2026), enviar antes da aprovação atrapalharia a
# revisão em curso — este workflow fica pronto e parado até você mandar.
#
# Reescrito em 16/09/2026 com duas mudanças que vieram direto dos erros
# de hoje:
#
#  1. A FAIXA virou entrada do workflow. Antes era fixa em `internal`
#     dentro do `eas.json`, e mudar de faixa exigia editar arquivo e
#     commitar — o mesmo tipo de passo manual que fez a gente passar a
#     noite chutando versionCode.
#  2. Confere o versionCode ANTES de enviar. A Play Console recusa
#     qualquer código menor ou igual a um já enviado, e o erro dela é
#     genérico o bastante pra ter me enganado três vezes. Agora a
#     conferência acontece aqui, com número na tela, e o envio nem
#     começa se fosse falhar.
on:
  workflow_dispatch:
    inputs:
      aab_url:
        description: "URL pública do .aab (asset da Release do build production)"
        type: string
        required: true
      faixa:
        description: "Faixa de destino na Play Console"
        type: choice
        required: true
        default: interno
        options:
          - interno
          - alpha
          - beta
          - producao

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Consultar o maior versionCode já na Play Console
        id: play
        uses: ./.github/actions/play-maior-versioncode
        with:
          service_account_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      # Trava de segurança (ver nota 2 no topo). Só falha quando o envio
      # FALHARIA de qualquer jeito — nunca bloqueia um envio válido.
      - name: Conferir o versionCode do pacote
        env:
          AAB_URL: ${{ inputs.aab_url }}
          MAIOR_NA_PLAY: ${{ steps.play.outputs.maior }}
          CONSULTA_OK: ${{ steps.play.outputs.ok }}
        run: |
          set -euo pipefail

          if [ "$CONSULTA_OK" != "true" ]; then
            echo "::warning::Sem resposta da Play Console — seguindo sem a conferência prévia."
            exit 0
          fi

          # versionCode do .aab que vai ser enviado: está no
          # AndroidManifest compilado, legível pelo aapt2 do SDK.
          curl -sSL --fail -o /tmp/app.aab "$AAB_URL"

          # `aapt2 dump xmltree` lê o manifesto de DENTRO do .aab — o
          # caminho é relativo ao pacote, não um arquivo já extraído
          # (dentro do .aab o manifesto está em protobuf, não no XML
          # binário que o aapt2 leria solto).
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -z "$AAPT2" ]; then
            echo "::warning::aapt2 não encontrado no runner — seguindo sem a conferência."
            exit 0
          fi
          DO_PACOTE=$("$AAPT2" dump xmltree --file base/manifest/AndroidManifest.xml /tmp/app.aab 2>/dev/null \
            | grep -m1 -oE 'versionCode[^=]*=[0-9]+' | grep -oE '[0-9]+$' || echo "")

          if [ -z "$DO_PACOTE" ]; then
            echo "::warning::Não consegui ler o versionCode do .aab — seguindo sem a conferência."
            exit 0
          fi

          echo "versionCode do pacote:        $DO_PACOTE"
          echo "maior já na Play Console:     $MAIOR_NA_PLAY"

          if [ "$DO_PACOTE" -le "$MAIOR_NA_PLAY" ]; then
            echo "::error::O pacote tem versionCode $DO_PACOTE, e a Play Console já tem $MAIOR_NA_PLAY. Ela recusaria o envio. Rode um build novo — a CI calcula o próximo número sozinha."
            exit 1
          fi
          echo "OK: $DO_PACOTE é maior que $MAIOR_NA_PLAY, o envio pode seguir."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Escrever a chave de conta de serviço do Google Play
        working-directory: apps/mobile
        env:
          KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY_JSON" ]; then
            echo "Secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON nao configurado — eas submit vai tentar usar credencial ja guardada na conta EAS, se existir."
          else
            printf '%s' "$KEY_JSON" > google-play-service-account.json
            echo "Chave escrita a partir do secret."
          fi

      - name: Enviar pro Play Console (faixa ${{ inputs.faixa }})
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest submit \
            --platform android \
            --profile "${{ inputs.faixa }}" \
            --url "${{ inputs.aab_url }}" \
            --non-interactive
