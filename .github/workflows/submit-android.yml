name: Enviar build Android pra Google Play

# Envia um `.aab` já publicado como GitHub Release direto pra Play
# Console, sem baixar/reenviar arquivo na mão. `eas submit` não usa a
# fila/cota de build da EAS (é só upload), então não é afetado pelo
# bloqueio do plano Free.
#
# NÃO dispara sozinho: só `workflow_dispatch`. Com o app em análise na
# Play Console (16/09/2026), enviar antes da aprovação atrapalharia a
# revisão em curso — este workflow fica pronto e parado até você mandar.
#
# Reescrito em 16/09/2026 com duas mudanças que vieram direto dos erros
# de hoje:
#
#  1. A FAIXA virou entrada do workflow. Antes era fixa em `internal`
#     dentro do `eas.json`, e mudar de faixa exigia editar arquivo e
#     commitar — o mesmo tipo de passo manual que fez a gente passar a
#     noite chutando versionCode.
#  2. Confere o versionCode ANTES de enviar. A Play Console recusa
#     qualquer código menor ou igual a um já enviado, e o erro dela é
#     genérico o bastante pra ter me enganado três vezes. Agora a
#     conferência acontece aqui, com número na tela, e o envio nem
#     começa se fosse falhar.
on:
  workflow_dispatch:
    inputs:
      aab_url:
        description: "URL pública do .aab (asset da Release do build production)"
        type: string
        required: true
      faixa:
        description: "Faixa de destino na Play Console"
        type: choice
        required: true
        default: interno
        options:
          - interno
          - alpha
          - beta
          - producao

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Trava de segurança (ver nota 2 no topo). Só falha quando o envio
      # FALHARIA de qualquer jeito — nunca bloqueia um envio válido.
      - name: Conferir o versionCode contra o que já está na Play Console
        env:
          KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACOTE: br.com.rottabr
          AAB_URL: ${{ inputs.aab_url }}
        run: |
          set -euo pipefail

          if [ -z "${KEY_JSON:-}" ]; then
            echo "::warning::Secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON ausente — seguindo sem a conferência prévia."
            exit 0
          fi

          # versionCode do .aab que vai ser enviado: está no
          # AndroidManifest compilado, legível pelo aapt2 do SDK.
          curl -sSL --fail -o /tmp/app.aab "$AAB_URL"

          # `aapt2 dump xmltree` lê o manifesto de DENTRO do .aab — o
          # caminho é relativo ao pacote, não um arquivo já extraído
          # (dentro do .aab o manifesto está em protobuf, não no XML
          # binário que o aapt2 leria solto).
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -z "$AAPT2" ]; then
            echo "::warning::aapt2 não encontrado no runner — seguindo sem a conferência."
            exit 0
          fi
          DO_PACOTE=$("$AAPT2" dump xmltree --file base/manifest/AndroidManifest.xml /tmp/app.aab 2>/dev/null \
            | grep -m1 -oE 'versionCode[^=]*=[0-9]+' | grep -oE '[0-9]+$' || echo "")

          if [ -z "$DO_PACOTE" ]; then
            echo "::warning::Não consegui ler o versionCode do .aab — seguindo sem a conferência."
            exit 0
          fi
          echo "versionCode do pacote: $DO_PACOTE"

          printf '%s' "$KEY_JSON" > /tmp/sa.json
          python3 -c "import json;print(json.load(open('/tmp/sa.json'))['private_key'])" > /tmp/sa.pem
          EMAIL=$(python3 -c "import json;print(json.load(open('/tmp/sa.json'))['client_email'])")

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          AGORA=$(date +%s)
          H=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          C=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' "$EMAIL" "$AGORA" "$((AGORA+3600))" | b64url)
          S=$(printf '%s.%s' "$H" "$C" | openssl dgst -sha256 -sign /tmp/sa.pem | b64url)
          TOKEN=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            --data-urlencode "assertion=$H.$C.$S" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")

          if [ -z "$TOKEN" ]; then
            echo "::warning::Não consegui autenticar na Play Console — seguindo sem a conferência."
            exit 0
          fi

          BASE="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACOTE"
          EDIT=$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Length: 0" "$BASE/edits" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          if [ -z "$EDIT" ]; then
            echo "::warning::Não consegui consultar as faixas — seguindo sem a conferência."
            exit 0
          fi

          curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/edits/$EDIT/tracks" > /tmp/tracks.json
          curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" "$BASE/edits/$EDIT" >/dev/null || true

          MAIOR=$(python3 -c "
          import json
          d = json.load(open('/tmp/tracks.json'))
          print(max([int(v) for t in d.get('tracks', []) for r in t.get('releases', []) for v in (r.get('versionCodes') or [])] + [0]))
          ")
          echo "maior versionCode já na Play Console: $MAIOR"

          if [ "$DO_PACOTE" -le "$MAIOR" ]; then
            echo "::error::O pacote tem versionCode $DO_PACOTE, e a Play Console já tem $MAIOR. Ela recusaria o envio. Rode um build novo — a CI calcula o próximo número sozinha."
            exit 1
          fi
          echo "OK: $DO_PACOTE é maior que $MAIOR, o envio pode seguir."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Escrever a chave de conta de serviço do Google Play
        working-directory: apps/mobile
        env:
          KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY_JSON" ]; then
            echo "Secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON nao configurado — eas submit vai tentar usar credencial ja guardada na conta EAS, se existir."
          else
            printf '%s' "$KEY_JSON" > google-play-service-account.json
            echo "Chave escrita a partir do secret."
          fi

      - name: Enviar pro Play Console (faixa ${{ inputs.faixa }})
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest submit \
            --platform android \
            --profile "${{ inputs.faixa }}" \
            --url "${{ inputs.aab_url }}" \
            --non-interactive
